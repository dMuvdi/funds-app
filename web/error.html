<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - BTG Fondos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1A1F36 0%, #2d3550 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            background: rgba(255, 107, 53, 0.1);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 107, 53, 0.3);
        }

        .error-icon svg {
            width: 64px;
            height: 64px;
            stroke: #FF6B35;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #FF6B35;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
        }

        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B35 0%, #ff8c5f 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-home:active {
            transform: translateY(0);
        }

        .error-code {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 24px;
            font-weight: 400;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            h2 {
                font-size: 20px;
            }

            .error-icon {
                width: 100px;
                height: 100px;
                margin-bottom: 24px;
            }

            .error-icon svg {
                width: 52px;
                height: 52px;
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>

        <h1>Oops!</h1>
        <h2>Algo salió mal</h2>
        <p>
            No pudimos encontrar la página que buscas. Es posible que el enlace esté roto o que la página haya sido
            movida.
        </p>

        <a href="/" class="btn-home">Volver al inicio</a>

        <p class="error-code">
            Si el problema persiste, por favor intenta recargar la página o contacta con soporte.
        </p>
    </div>

    <script>
        // Optionally redirect to home after a delay
        // setTimeout(() => { window.location.href = '/'; }, 5000);
    </script>
</body>

</html>
