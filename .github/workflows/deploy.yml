name: Build & Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate mocks
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test

  deploy:
    name: Build Web & Deploy to S3
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate required files
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Build Flutter web
        run: flutter build web --release --base-href /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync build/web/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "error.html" \
            --exclude "flutter_service_worker.js"
          
          aws s3 cp build/web/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          
          aws s3 cp build/web/error.html s3://${{ secrets.S3_BUCKET }}/error.html \
            --cache-control "no-cache, no-store, must-revalidate"
          
          aws s3 cp build/web/flutter_service_worker.js s3://${{ secrets.S3_BUCKET }}/flutter_service_worker.js \
            --cache-control "no-cache, no-store, must-revalidate"
